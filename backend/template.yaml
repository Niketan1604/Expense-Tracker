    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AppName}-${EnvName}-put-user-profile"
      Handler: user/putUserProfile/index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Description: "PUT /user/profile — create or update user profile"
      Events:
        PutUserProfile:
