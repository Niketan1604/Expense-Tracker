  # ───────────────────────────────────────────────────────
  # SPLITWISE ECS ROUTING (VPC Link & Cloud Map private integration)
  # ───────────────────────────────────────────────────────
  SplitwiseVpcLink:
    Type: AWS::ApiGatewayV2::VpcLink
    Properties:
      Name: !Sub "${AppName}-${EnvName}-splitwise-vpclink"
      SecurityGroupIds:
        - !Sub "{{resolve:ssm:/flowmint/${EnvName}/splitwise-network/vpclink-sg-id}}"
      SubnetIds:
        - !Sub "{{resolve:ssm:/flowmint/${EnvName}/splitwise-network/public-subnet-1-id}}"
        - !Sub "{{resolve:ssm:/flowmint/${EnvName}/splitwise-network/public-subnet-2-id}}"

  SplitwiseIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      Description: Private route to Splitwise Spring Boot ECS service via Cloud Map
      IntegrationType: HTTP_PROXY
      IntegrationMethod: ANY
      ConnectionType: VPC_LINK
      ConnectionId: !Ref SplitwiseVpcLink
      CredentialsArn: !GetAtt ApiGatewayCloudMapRole.Arn
      IntegrationUri: !Sub "{{resolve:ssm:/flowmint/${EnvName}/splitwise-compute/cloudmap-service-arn}}"

  SplitwiseGetRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /api/{proxy+}"
      Target: !Join ["/", ["integrations", !Ref SplitwiseIntegration]]

  SplitwisePostRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /api/{proxy+}"
      Target: !Join ["/", ["integrations", !Ref SplitwiseIntegration]]

  SplitwisePutRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "PUT /api/{proxy+}"
      Target: !Join ["/", ["integrations", !Ref SplitwiseIntegration]]

  SplitwiseDeleteRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "DELETE /api/{proxy+}"
      Target: !Join ["/", ["integrations", !Ref SplitwiseIntegration]]


  # ───────────────────────────────────────────────────────
  # SSM Export — API Endpoint
  #
  # Written automatically on every SAM deploy.
  # Frontend reads this as NEXT_PUBLIC_API_URL.
  # Jenkinsfile smoke test hits /health using this value.
  # ───────────────────────────────────────────────────────
  ApiEndpointParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/${AppName}/${EnvName}/backend/api-endpoint"
      Type: String
      Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${EnvName}"
      Description: !Sub "${AppName} ${EnvName} backend — api-endpoint"

# =========================================================
# Conditions
# =========================================================
Conditions:
  IsProd: !Equals [!Ref EnvName, prod]
