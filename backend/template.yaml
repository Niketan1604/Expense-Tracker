AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: FlowMint — Backend (Lambda + API Gateway)

# =========================================================
# Parameters
#
# EnvName is passed by Jenkinsfile via --parameter-overrides
# All SSM values are resolved at deploy time using
# {{resolve:ssm:...}} — no SDK calls needed inside Lambda.
# =========================================================
Parameters:
  AppName:
    Type: String
    Default: flowmint

  EnvName:
    Type: String
    AllowedValues: [dev, prod]

# =========================================================
# Globals
#
# Applied to every Lambda function unless overridden.
# Environment variables are resolved from SSM at deploy time
# using !Sub + {{resolve:ssm:...}} pattern — EnvName is
# substituted first by CloudFormation, then SSM is resolved.
#
# Note: Metadata.BuildMethod cannot be set in Globals —
# SAM limitation. Each function defines its own Metadata
# block with only EntryPoints differing per function.
# =========================================================
Globals:
  Function:
    Runtime: nodejs24.x
    Architectures: [arm64] # Graviton2 — cheaper + faster than x86
    Timeout: 29 # API Gateway HTTP API hard limit is 30s
    MemorySize: 256 # good balance of cost vs cold start on arm64
    Tracing: Active # X-Ray — 100k traces/month free tier
    CodeUri: ./
    Environment:
      Variables:
        NODE_OPTIONS: "--enable-source-maps"
        APP_NAME: !Ref AppName
        ENV_NAME: !Ref EnvName
        # Resolved from SSM at deploy time — zero latency at runtime
        TABLE_NAME: !Sub "{{resolve:ssm:/flowmint/${EnvName}/database/table-name}}"
        ISSUER_URL: !Sub "{{resolve:ssm:/flowmint/${EnvName}/cognito/issuer-url}}"
        APP_CLIENT_ID: !Sub "{{resolve:ssm:/flowmint/${EnvName}/cognito/app-client-id}}"

  Api:
    TracingEnabled: true

# =========================================================
# Resources
# =========================================================
Resources:
  # ───────────────────────────────────────────────────────
  # IAM — Lambda Execution Role
  #
  # Single role shared by all Lambda functions.
  # Scoped strictly to this app's DynamoDB table only.
  # CloudWatch Logs permissions added for Lambda to write logs.
  # X-Ray permissions for tracing.
  # ───────────────────────────────────────────────────────
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AppName}-${EnvName}-lambda-execution-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:TransactWriteItems
                Resource:
                  - !Sub "{{resolve:ssm:/flowmint/${EnvName}/database/table-arn}}"
                  - !Sub "{{resolve:ssm:/flowmint/${EnvName}/database/gsi1-arn}}"
                  - !Sub "{{resolve:ssm:/flowmint/${EnvName}/database/gsi2-arn}}"

        - PolicyName: CloudWatchLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AppName}-${EnvName}-*"

        - PolicyName: XRayAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: "*" # X-Ray does not support resource-level permissions

  # ───────────────────────────────────────────────────────
  # API Gateway Cloud Map Discovery Role
  #
  # Required for HTTP API VPC Link to query Cloud Map and
  # discover the dynamic IP addresses of the ECS tasks.
  # Without this, the integration fails immediately with a 500.
  # ───────────────────────────────────────────────────────
  ApiGatewayCloudMapRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AppName}-${EnvName}-apigw-cloudmap-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CloudMapDiscoveryPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - servicediscovery:DiscoverInstances
                Resource: "*"

  ApiGatewayLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/apigateway/${AppName}-${EnvName}-api"
      RetentionInDays: !If [IsProd, 30, 7]

  # ───────────────────────────────────────────────────────
  # HTTP API (API Gateway v2)
  #
  # HTTP API is cheaper and faster than REST API.
  # JWT authorizer validates Cognito tokens on every request
  # except /health which is public (no auth required).
  #
  # CORS is configured here at the API level — no need to
  # handle OPTIONS in Lambda handlers.
  # ───────────────────────────────────────────────────────
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: !Sub "${AppName}-${EnvName}-api"
      StageName: !Ref EnvName
      DefaultRouteSettings:
        ThrottlingBurstLimit: 100
        ThrottlingRateLimit: 50

      # JWT Authorizer — validates Cognito access tokens
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              issuer: !Sub "{{resolve:ssm:/flowmint/${EnvName}/cognito/issuer-url}}"
              audience:
                - !Sub "{{resolve:ssm:/flowmint/${EnvName}/cognito/app-client-id}}"

      # CORS — handled at API Gateway level, not in Lambda
      CorsConfiguration:
        AllowOrigins:
          - !Sub "https://{{resolve:ssm:/flowmint/${EnvName}/edge/cloudfront-domain}}"
          - "http://localhost:3000"
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Authorization
          - Content-Type
        AllowCredentials: false
        MaxAge: 300

      AccessLogSettings:
        DestinationArn: !GetAtt ApiGatewayLogGroup.Arn
        Format: '{"requestId":"$context.requestId", "ip": "$context.identity.sourceIp", "requestTime":"$context.requestTime", "httpMethod":"$context.httpMethod","routeKey":"$context.routeKey", "status":"$context.status","protocol":"$context.protocol", "responseLength":"$context.responseLength", "integrationError":"$context.integrationErrorMessage"}'

  # ───────────────────────────────────────────────────────
  # FOUNDATION APIs
  # ───────────────────────────────────────────────────────

  # ── GET /health ────────────────────────────────────────
  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AppName}-${EnvName}-health"
      Handler: health/index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Description: "Health check — public, no auth"
      Events:
        GetHealth:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /health
            Method: GET
            Auth:
              Authorizer: NONE
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        Sourcemap: true
        EntryPoints:
          - src/health/index.ts

  HealthFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AppName}-${EnvName}-health"
      RetentionInDays: !If [IsProd, 30, 7]

  # ── GET /user/profile ──────────────────────────────────
  GetUserProfileFunction:
