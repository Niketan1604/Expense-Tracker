          Properties:
            ApiId: !Ref HttpApi
            Path: /user/profile
            Method: PUT
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        Sourcemap: true
        EntryPoints:
