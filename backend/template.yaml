    Properties:
      FunctionName: !Sub "${AppName}-${EnvName}-get-user-profile"
      Handler: user/getUserProfile/index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Description: "GET /user/profile — returns authenticated user profile"
      Events:
        GetUserProfile:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /user/profile
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        Sourcemap: true
        EntryPoints:
          - src/user/getUserProfile/index.ts

  GetUserProfileLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AppName}-${EnvName}-get-user-profile"
      RetentionInDays: !If [IsProd, 30, 7]

  # ── PUT /user/profile ──────────────────────────────────
